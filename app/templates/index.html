

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    .main-page {
        min-height: 100vh;
        margin: -20px;
        padding: 60px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .main-page__container {
        max-width: 900px;
        width: 100%;
        text-align: center;
    }

    .main-page__title {
        font-size: 48px;
        font-weight: 700;
        color: #fff;
        margin: 0 0 10px;
        letter-spacing: -1px;
    }

    .main-page__subtitle {
        font-size: 18px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.9);
        margin: 0 0 50px;
    }

    .main-page__nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
        margin-bottom: 40px;
    }

    .main-page__card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        padding: 32px 24px;
        text-decoration: none;
        color: #333;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .main-page__card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        background: #fff;
    }

    .main-page__card-icon {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
    }

    .main-page__card-title {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #333;
    }

    .main-page__card-desc {
        font-size: 14px;
        color: #666;
        line-height: 1.5;
        margin: 0;
    }

    .main-page__footer {
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        margin-top: 20px;
    }

    @media (max-width: 768px) {
        .main-page__title {
            font-size: 32px;
        }
        .main-page__subtitle {
            font-size: 16px;
            margin-bottom: 30px;
        }
        .main-page__nav {
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .main-page__card {
            padding: 24px 20px;
        }
    }
</style>

<div class="main-page">
    <div class="main-page__container">
        <p class="main-page__subtitle">Демонстрация принципов программирования и методологий</p>

        <nav class="main-page__nav">
            <a href="/kt2/" class="main-page__card">
                <div class="main-page__card-icon">🎯</div>
                <h2 class="main-page__card-title">Принципы ООП</h2>
                <p class="main-page__card-desc">Инкапсуляция, наследование, полиморфизм, абстракция</p>
            </a>

            <a href="/kt3/" class="main-page__card">
                <div class="main-page__card-icon">⚡</div>
                <h2 class="main-page__card-title">Принципы SOLID</h2>
                <p class="main-page__card-desc">S, O, L, I, D — основы чистого кода</p>
            </a>

            <a href="/kt4/" class="main-page__card">
                <div class="main-page__card-icon">🛒</div>
                <h2 class="main-page__card-title">Интернет-магазин</h2>
                <p class="main-page__card-desc">Реализация с использованием методологии БЭМ</p>
            </a>
        </nav>

        <div class="main-page__footer">© 2026</div>
    </div>
</div>
